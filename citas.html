<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10100f">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de citas | La Firms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body class="finance-page">
    <main class="finance-shell">
        <header class="finance-header">
            <a class="finance-brand" href="index.html" aria-label="Volver a La Firms"><img src="img/logo.jpg" alt=""><span>LA FIRMS<small>ADMINISTRACIÓN</small></span></a>
            <a class="finance-back" href="index.html">Volver al sitio ↗</a>
        </header>
        <section class="appointments-dashboard" id="appointments-dashboard" hidden>
            <div class="finance-dashboard-heading">
                <div><p class="eyebrow dark-eyebrow">ADMINISTRACIÓN</p><h1>Panel de citas</h1></div>
                <div class="finance-dashboard-actions">
                    <a class="finance-logout" href="finanzas.html">Finanzas</a>
                    <a class="finance-logout" href="barberos.html">Barberos</a>
                    <button class="finance-logout" id="appointments-logout" type="button">Cerrar sesión</button>
                </div>
            </div>
            <p class="appointments-intro">Consulta las reservas y actualiza su estado.</p>
            <div class="appointment-filters">
                <div>
                    <label class="finance-month-label" for="appointments-month">Mes</label>
                    <div class="finance-month-picker">
                        <button id="appointments-month-previous" type="button" aria-label="Mes anterior">‹</button>
                        <span id="appointments-month-name" aria-live="polite"></span>
                        <button id="appointments-month-next" type="button" aria-label="Mes siguiente">›</button>
                    </div>
                    <input id="appointments-month" type="hidden">
                </div>
                <div>
                    <label class="finance-month-label" for="appointments-status-filter">Estado</label>
                    <select class="appointment-status-filter" id="appointments-status-filter">
                        <option value="todas">Todos los estados</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="confirmada">Confirmadas</option>
                        <option value="atendida">Atendidas</option>
                        <option value="cancelada">Canceladas</option>
                    </select>
                </div>
            </div>
            <p class="finance-message" id="appointments-error" role="alert"></p>
            <div class="appointment-list" id="appointment-list" aria-live="polite"></div>
            <p class="appointment-empty" id="appointment-empty" hidden>No hay citas para los filtros seleccionados.</p>
        </section>
        <p class="finance-message" id="appointments-load-error" role="alert"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const dashboard = document.querySelector('#appointments-dashboard');
        const list = document.querySelector('#appointment-list');
        const emptyMessage = document.querySelector('#appointment-empty');
        const errorMessage = document.querySelector('#appointments-error');
        const loadError = document.querySelector('#appointments-load-error');
        const monthInput = document.querySelector('#appointments-month');
        const monthName = document.querySelector('#appointments-month-name');
        const statusFilter = document.querySelector('#appointments-status-filter');
        const monthFormatter = new Intl.DateTimeFormat('es-CO', {
            month: 'long',
            year: 'numeric',
            timeZone: 'America/Bogota'
        });
        const statusLabels = {
            pendiente: 'Pendiente',
            confirmada: 'Confirmada',
            atendida: 'Atendida',
            cancelada: 'Cancelada'
        };

        const renderMonth = () => {
            const [year, month] = monthInput.value.split('-').map(Number);
            monthName.textContent = monthFormatter.format(new Date(Date.UTC(year, month - 1, 15, 12)));
        };

        const formatAppointmentDate = (date) => {
            if (!date) return 'Fecha pendiente';
            const [year, month, day] = date.split('-').map(Number);
            return new Intl.DateTimeFormat('es-CO', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(year, month - 1, day, 12)));
        };

        const formatAppointmentTime = (time) => {
            if (!time) return 'Hora pendiente';
            const [hour, minute] = time.split(':').map(Number);
            return new Intl.DateTimeFormat('es-CO', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(2020, 0, 1, hour, minute)));
        };

        const renderAppointments = (appointments) => {
            list.replaceChildren();
            emptyMessage.hidden = appointments.length > 0;
            for (const appointment of appointments) {
                const card = document.createElement('article');
                card.className = 'appointment-card';

                const header = document.createElement('div');
                header.className = 'appointment-card-heading';
                const customer = document.createElement('div');
                const name = document.createElement('h2');
                name.textContent = appointment.nombre || 'Cliente';
                const phone = document.createElement('a');
                phone.href = appointment.telefono ? `tel:${String(appointment.telefono).replace(/[^\d+]/g, '')}` : '#';
                phone.textContent = appointment.telefono || 'Sin teléfono';
                customer.append(name, phone);
                const badge = document.createElement('span');
                badge.className = `appointment-status-badge is-${appointment.status}`;
                badge.textContent = statusLabels[appointment.status] || appointment.status || 'Pendiente';
                header.append(customer, badge);

                const details = document.createElement('div');
                details.className = 'appointment-details';
                for (const detail of [
                    ['Fecha', formatAppointmentDate(appointment.appointment_date)],
                    ['Hora', formatAppointmentTime(appointment.appointment_time)],
                    ['Servicio', appointment.service || 'No especificado']
                ]) {
                    const item = document.createElement('p');
                    const label = document.createElement('span');
                    label.textContent = detail[0];
                    const value = document.createElement('strong');
                    value.textContent = detail[1];
                    item.append(label, value);
                    details.append(item);
                }

                const message = document.createElement('p');
                message.className = 'appointment-message';
                message.textContent = appointment.mensaje || 'Sin mensaje adicional.';

                const actions = document.createElement('div');
                actions.className = 'appointment-card-actions';
                const actionLabel = document.createElement('label');
                actionLabel.textContent = 'Actualizar estado';
                actionLabel.htmlFor = `appointment-status-${appointment.id}`;
                const actionSelect = document.createElement('select');
                actionSelect.id = `appointment-status-${appointment.id}`;
                actionSelect.setAttribute('aria-label', `Estado de la cita de ${appointment.nombre || 'cliente'}`);
                for (const [value, label] of Object.entries(statusLabels)) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = label;
                    option.selected = value === appointment.status;
                    actionSelect.append(option);
                }
                actionSelect.addEventListener('change', async () => {
                    actionSelect.disabled = true;
                    errorMessage.textContent = '';
                    try {
                        const res = await fetch(`/api/finanzas/citas/${appointment.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ status: actionSelect.value })
                        });
                        const data = await res.json();
                        if (res.status === 401) {
                            window.location.replace('finanzas.html?return=citas');
                            return;
                        }
                        if (!res.ok) throw new Error(data.error || 'No se pudo actualizar el estado.');
                        await loadAppointments();
                    } catch (error) {
                        errorMessage.textContent = error.message;
                        actionSelect.value = appointment.status;
                    } finally {
                        actionSelect.disabled = false;
                    }
                });
                actions.append(actionLabel, actionSelect);
                card.append(header, details, message, actions);
                list.append(card);
            }
        };

        const loadAppointments = async () => {
            errorMessage.textContent = '';
            loadError.textContent = '';
            const month = monthInput.value;
            try {
                const res = await fetch(`/api/finanzas/citas?month=${encodeURIComponent(month)}&status=${encodeURIComponent(statusFilter.value)}`);
                if (res.status === 401) {
                    window.location.replace('finanzas.html?return=citas');
                    return;
                }
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'No se pudieron consultar las citas.');
                const appointments = data.appointments || [];
                renderAppointments(appointments.map((appointment) => ({
                    id: appointment.id,
                    nombre: appointment.nombre || 'Cliente',
                    telefono: appointment.telefono || '',
                    mensaje: appointment.mensaje || '',
                    appointment_date: appointment.appointmentDate || appointment.appointment_date,
                    appointment_time: appointment.appointmentTime || appointment.appointment_time,
                    service: appointment.service || 'No especificado',
                    status: appointment.status || 'pendiente'
                })));
            } catch (error) {
                loadError.textContent = error.message;
            }
        };

        const changeMonth = (offset) => {
            const [year, month] = monthInput.value.split('-').map(Number);
            const nextMonth = new Date(Date.UTC(year, month - 1 + offset, 1, 12));
            monthInput.value = `${nextMonth.getUTCFullYear()}-${String(nextMonth.getUTCMonth() + 1).padStart(2, '0')}`;
            renderMonth();
            loadAppointments().catch((error) => { loadError.textContent = error.message; });
        };

        document.querySelector('#appointments-month-previous').addEventListener('click', () => changeMonth(-1));
        document.querySelector('#appointments-month-next').addEventListener('click', () => changeMonth(1));
        statusFilter.addEventListener('change', () => {
            loadAppointments().catch((error) => { loadError.textContent = error.message; });
        });
        document.querySelector('#appointments-logout').addEventListener('click', async () => {
            try {
                await fetch('/api/salir', { method: 'POST' });
            } catch {
                // Redirigimos igualmente al formulario de acceso.
            }
            window.location.replace('finanzas.html');
        });

        const todayParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Bogota',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).formatToParts(new Date());
        const today = Object.fromEntries(todayParts.map(({ type, value }) => [type, value]));
        monthInput.value = `${today.year}-${today.month}`;
        renderMonth();

        (async () => {
            try {
                const res = await fetch('/api/acceso');
                const data = await res.json();
                if (!data.finanzas && !data.barberos) {
                    window.location.replace('finanzas.html?return=citas');
                    return;
                }
                dashboard.hidden = false;
                await loadAppointments();
            } catch {
                loadError.textContent = 'No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.';
            }
        })();
    </script>
</body>
</html>
